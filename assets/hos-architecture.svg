<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171717"/><stop offset="1" stop-color="#1e2326"/></linearGradient><linearGradient id="aur" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10a37f"/><stop offset="0.35" stop-color="#3b82f6"/><stop offset="0.7" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#a855f7" stop-opacity="0.35"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/></marker></defs><rect width="1200" height="470" rx="36" fill="url(#bg)"/><ellipse cx="1020.0" cy="0" rx="540.0" ry="423.0" fill="url(#glow)"/><rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#aur)"/><rect x="1" y="1" width="1198" height="468" rx="36" fill="none" stroke="#343434" stroke-width="2"/><text x="48.0" y="64.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="start">How a request becomes an action</text><text x="48.0" y="96.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#a3a3a3" text-anchor="start">Every step has a visible output the operator can check</text><rect x="36.0" y="120.0" width="240.0" height="134.0" rx="24" fill="#212121" fill-opacity="1" stroke="#10a37f" stroke-width="2"/><circle cx="70.0" cy="154.0" r="18" fill="#10a37f"/><text x="70.0" y="160.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0d0d0d" text-anchor="middle">1</text><text x="98.0" y="160.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="start">Scene intake</text><text x="58.0" y="194.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">Image, USB camera or</text><text x="58.0" y="215.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">operator input.</text><text x="58.0" y="236.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">Normalizes the input.</text><line x1="284" y1="187.0" x2="324" y2="187.0" stroke="#10a37f" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="332.0" y="120.0" width="240.0" height="134.0" rx="24" fill="#212121" fill-opacity="1" stroke="#a855f7" stroke-width="2"/><circle cx="366.0" cy="154.0" r="18" fill="#a855f7"/><text x="366.0" y="160.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0d0d0d" text-anchor="middle">2</text><text x="394.0" y="160.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="start">Vision</text><text x="354.0" y="194.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">Finds objects and maps</text><text x="354.0" y="215.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">them to a 20 x 11 board</text><text x="354.0" y="236.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">grid.</text><line x1="580" y1="187.0" x2="620" y2="187.0" stroke="#10a37f" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="628.0" y="120.0" width="240.0" height="134.0" rx="24" fill="#212121" fill-opacity="1" stroke="#3b82f6" stroke-width="2"/><circle cx="662.0" cy="154.0" r="18" fill="#3b82f6"/><text x="662.0" y="160.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0d0d0d" text-anchor="middle">3</text><text x="690.0" y="160.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="start">Reasoning</text><text x="650.0" y="194.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">Component, dexterity and</text><text x="650.0" y="215.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">grip reasoning.</text><line x1="876" y1="187.0" x2="916" y2="187.0" stroke="#10a37f" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="924.0" y="120.0" width="240.0" height="134.0" rx="24" fill="#212121" fill-opacity="1" stroke="#f59e0b" stroke-width="2"/><circle cx="958.0" cy="154.0" r="18" fill="#f59e0b"/><text x="958.0" y="160.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0d0d0d" text-anchor="middle">4</text><text x="986.0" y="160.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="start">Planner</text><text x="946.0" y="194.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">Ordered, board-aware</text><text x="946.0" y="215.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">command sequence.</text><line x1="996" y1="254" x2="996" y2="274" stroke="#a3a3a3" stroke-width="3" stroke-linecap="round"/><line x1="296" y1="274" x2="996" y2="274" stroke="#a3a3a3" stroke-width="3" stroke-linecap="round"/><line x1="296" y1="274" x2="296" y2="296" stroke="#a3a3a3" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="904" y1="274" x2="904" y2="296" stroke="#a3a3a3" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="36.0" y="296.0" width="520.0" height="96.0" rx="24" fill="#212121" fill-opacity="1" stroke="#10a37f" stroke-width="2"/><circle cx="70.0" cy="330.0" r="18" fill="#10a37f"/><text x="70.0" y="336.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0d0d0d" text-anchor="middle">5</text><text x="98.0" y="336.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="start">Visual simulation</text><text x="58.0" y="370.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">Rehearse the same command sequence on screen first.</text><rect x="644.0" y="296.0" width="520.0" height="96.0" rx="24" fill="#212121" fill-opacity="1" stroke="#ec4899" stroke-width="2"/><circle cx="678.0" cy="330.0" r="18" fill="#ec4899"/><text x="678.0" y="336.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0d0d0d" text-anchor="middle">6</text><text x="706.0" y="336.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="start">Guarded USB serial output</text><text x="666.0" y="370.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">Sent to the robot only after a separate, deliberate arm</text><text x="666.0" y="391.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#a3a3a3" text-anchor="start">step.</text><line x1="296" y1="392" x2="296" y2="424" stroke="#a3a3a3" stroke-width="3" stroke-linecap="round"/><line x1="904" y1="392" x2="904" y2="424" stroke="#a3a3a3" stroke-width="3" stroke-linecap="round"/><rect x="36.0" y="424.0" width="1128.0" height="36.0" rx="18" fill="#10a37f" fill-opacity="0.9"/><text x="600.0" y="448.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#0d0d0d" text-anchor="middle">Operator review: approve the plan before any motion</text></svg>