<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="522" viewBox="0 0 1200 522"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#131d3b"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/></marker></defs><rect width="1200" height="522" rx="36" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="520" rx="36" fill="none" stroke="#24314f" stroke-width="2"/><text x="48.0" y="64.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="start">Supported interaction model</text><text x="48.0" y="96.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" text-anchor="start">Most tabletop tasks reduce to these four groups</text><clipPath id="clactions"><rect x="36" y="130" width="1128" height="356" rx="22"/></clipPath><g clip-path="url(#clactions)"><rect x="36.0" y="130.0" width="1128.0" height="58.0" rx="0" fill="#a78bfa" fill-opacity="1"/><text x="52.0" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">Action category</text><text x="277.6" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">Examples</text><text x="664.3" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">Intended use</text><rect x="36.0" y="188.0" width="1128.0" height="78.0" rx="0" fill="#111b33" fill-opacity="1"/><text x="52.0" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#a78bfa" text-anchor="start">Positioning</text><text x="277.6" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">goto_coordinate(...), contact(...)</text><text x="664.3" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Move toward a board location or make controlled</text><text x="664.3" y="245.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">contact with a surface.</text><rect x="36.0" y="266.0" width="1128.0" height="64.0" rx="0" fill="#0d1630" fill-opacity="1"/><text x="52.0" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#a78bfa" text-anchor="start">Manipulation</text><text x="277.6" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">pickup(), keep(), release()</text><text x="664.3" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Acquire, carry, place, or let go of an object.</text><rect x="36.0" y="330.0" width="1128.0" height="78.0" rx="0" fill="#111b33" fill-opacity="1"/><text x="52.0" y="361.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#a78bfa" text-anchor="start">Task-specific</text><text x="277.6" y="361.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">pour(), slice(), press(...)</text><text x="664.3" y="361.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Interactions that need a distinct device-side</text><text x="664.3" y="387.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">behavior.</text><rect x="36.0" y="408.0" width="1128.0" height="78.0" rx="0" fill="#0d1630" fill-opacity="1"/><text x="52.0" y="439.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#a78bfa" text-anchor="start">Timing and state</text><text x="277.6" y="439.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">wait(...), complete()</text><text x="664.3" y="439.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Hold for a set time, then signal the end of the</text><text x="664.3" y="465.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">task.</text></g><rect x="36" y="130" width="1128" height="356" rx="22" fill="none" stroke="#24314f" stroke-width="2"/></svg>