<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#131d3b"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/></marker></defs><rect width="1200" height="380" rx="36" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="378" rx="36" fill="none" stroke="#24314f" stroke-width="2"/><text x="48.0" y="64.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="start">Two physical roles</text><text x="48.0" y="96.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" text-anchor="start">HOS is organized around two parts of a robot</text><clipPath id="clcomponents"><rect x="36" y="130" width="1128" height="214" rx="22"/></clipPath><g clip-path="url(#clcomponents)"><rect x="36.0" y="130.0" width="1128.0" height="58.0" rx="0" fill="#22d3ee" fill-opacity="1"/><text x="52.0" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">Component</text><text x="315.2" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">Role</text><text x="503.2" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">Responsibility</text><rect x="36.0" y="188.0" width="1128.0" height="78.0" rx="0" fill="#111b33" fill-opacity="1"/><text x="52.0" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Robotic arm</text><text x="315.2" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Worker</text><text x="503.2" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Manipulation, contact, pickup, placement, tool-oriented actions,</text><text x="503.2" y="245.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">and task execution.</text><rect x="36.0" y="266.0" width="1128.0" height="78.0" rx="0" fill="#0d1630" fill-opacity="1"/><text x="52.0" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Mobile base</text><text x="315.2" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Mover</text><text x="503.2" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Locomotion, positioning, orientation, and eventually navigation</text><text x="503.2" y="323.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">beyond a tabletop workspace.</text></g><rect x="36" y="130" width="1128" height="214" rx="22" fill="none" stroke="#24314f" stroke-width="2"/></svg>