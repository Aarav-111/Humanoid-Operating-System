<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="664" viewBox="0 0 1200 664"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#131d3b"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/></marker></defs><rect width="1200" height="664" rx="36" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="662" rx="36" fill="none" stroke="#24314f" stroke-width="2"/><text x="48.0" y="64.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="start">Where to start</text><text x="48.0" y="96.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" text-anchor="start">Pick a track based on what you need</text><clipPath id="clnavigate"><rect x="36" y="130" width="1128" height="498" rx="22"/></clipPath><g clip-path="url(#clnavigate)"><rect x="36.0" y="130.0" width="1128.0" height="58.0" rx="0" fill="#22d3ee" fill-opacity="1"/><text x="52.0" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">Folder</text><text x="289.5" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">What you will find</text><text x="734.7" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">Use it when</text><rect x="36.0" y="188.0" width="1128.0" height="78.0" rx="0" fill="#111b33" fill-opacity="1"/><text x="52.0" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">README.md</text><text x="289.5" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Purpose, architecture, roadmap, history,</text><text x="289.5" y="245.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">benchmarks, team.</text><text x="734.7" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">You are new to HOS.</text><rect x="36.0" y="266.0" width="1128.0" height="78.0" rx="0" fill="#0d1630" fill-opacity="1"/><text x="52.0" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Software</text><text x="289.5" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">S1-SRC, S1.5-SRC and the S(x) preview.</text><text x="734.7" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">You work on the SRC software-control</text><text x="734.7" y="323.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">flow.</text><rect x="36.0" y="344.0" width="1128.0" height="78.0" rx="0" fill="#111b33" fill-opacity="1"/><text x="52.0" y="375.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Hardware</text><text x="289.5" y="375.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Firmware, hardware docs and 3D models.</text><text x="734.7" y="375.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">You work on controllers, mechanics or</text><text x="734.7" y="401.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">wiring.</text><rect x="36.0" y="422.0" width="1128.0" height="64.0" rx="0" fill="#0d1630" fill-opacity="1"/><text x="52.0" y="453.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Simulation/Virtual</text><text x="289.5" y="453.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">K1 to K9D virtual simulators.</text><text x="734.7" y="453.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">You want the simulation-first path.</text><rect x="36.0" y="486.0" width="1128.0" height="64.0" rx="0" fill="#111b33" fill-opacity="1"/><text x="52.0" y="517.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Simulation/Physical</text><text x="289.5" y="517.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">A2.6-Sol and A3-Terra.</text><text x="734.7" y="517.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">You work on camera-to-grid and arm tests.</text><rect x="36.0" y="550.0" width="1128.0" height="78.0" rx="0" fill="#0d1630" fill-opacity="1"/><text x="52.0" y="581.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Benchmarks</text><text x="289.5" y="581.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">MMRO dataset, Robobench and the task</text><text x="289.5" y="607.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">list.</text><text x="734.7" y="581.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">You reproduce or review evaluations.</text></g><rect x="36" y="130" width="1128" height="498" rx="22" fill="none" stroke="#24314f" stroke-width="2"/></svg>