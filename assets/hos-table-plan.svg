<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="692" viewBox="0 0 1200 692"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#131d3b"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/></marker></defs><rect width="1200" height="692" rx="36" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="690" rx="36" fill="none" stroke="#24314f" stroke-width="2"/><text x="48.0" y="64.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="start">How the planning loop works</text><text x="48.0" y="96.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" text-anchor="start">Every stage has one thing the operator should check</text><clipPath id="clplan"><rect x="36" y="130" width="1128" height="526" rx="22"/></clipPath><g clip-path="url(#clplan)"><rect x="36.0" y="130.0" width="1128.0" height="58.0" rx="0" fill="#22d3ee" fill-opacity="1"/><text x="52.0" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">Stage</text><text x="277.6" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">What it contributes</text><text x="728.8" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">What the operator checks</text><rect x="36.0" y="188.0" width="1128.0" height="78.0" rx="0" fill="#111b33" fill-opacity="1"/><text x="52.0" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Vision</text><text x="277.6" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Detects and outlines discrete objects;</text><text x="277.6" y="245.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">converts their position to the board.</text><text x="728.8" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Does the outline contain the right object?</text><rect x="36.0" y="266.0" width="1128.0" height="78.0" rx="0" fill="#0d1630" fill-opacity="1"/><text x="52.0" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Component</text><text x="52.0" y="323.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">inspection</text><text x="277.6" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Identifies useful object parts, including</text><text x="277.6" y="323.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">handles, rims, and controls.</text><text x="728.8" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Is the selected sub-part the one a robot</text><text x="728.8" y="323.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">should interact with?</text><rect x="36.0" y="344.0" width="1128.0" height="78.0" rx="0" fill="#111b33" fill-opacity="1"/><text x="52.0" y="375.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Dexterity</text><text x="277.6" y="375.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Assesses whether the requested movement is</text><text x="277.6" y="401.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">physically plausible.</text><text x="728.8" y="375.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Does the action make sense for the tool,</text><text x="728.8" y="401.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">object, and available space?</text><rect x="36.0" y="422.0" width="1128.0" height="78.0" rx="0" fill="#0d1630" fill-opacity="1"/><text x="52.0" y="453.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Gripper AI</text><text x="277.6" y="453.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Suggests safer grip cells or contact</text><text x="277.6" y="479.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">locations.</text><text x="728.8" y="453.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Is the proposed contact away from hazards</text><text x="728.8" y="479.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">and on a stable region?</text><rect x="36.0" y="500.0" width="1128.0" height="78.0" rx="0" fill="#111b33" fill-opacity="1"/><text x="52.0" y="531.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Planner</text><text x="277.6" y="531.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Produces an ordered command sequence tied</text><text x="277.6" y="557.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">to board coordinates.</text><text x="728.8" y="531.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Are the order, destination, waits, and</text><text x="728.8" y="557.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">release steps correct?</text><rect x="36.0" y="578.0" width="1128.0" height="78.0" rx="0" fill="#0d1630" fill-opacity="1"/><text x="52.0" y="609.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">Simulator / serial</text><text x="52.0" y="635.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22d3ee" text-anchor="start">link</text><text x="277.6" y="609.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Replays or transmits the same parsed</text><text x="277.6" y="635.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">commands.</text><text x="728.8" y="609.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Has the plan been rehearsed, calibrated,</text><text x="728.8" y="635.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">and deliberately armed?</text></g><rect x="36" y="130" width="1128" height="526" rx="22" fill="none" stroke="#24314f" stroke-width="2"/></svg>