<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1224"/><stop offset="1" stop-color="#131d3b"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/></marker></defs><rect width="1200" height="600" rx="36" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="598" rx="36" fill="none" stroke="#24314f" stroke-width="2"/><text x="48.0" y="64.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="start">Safety and responsible use</text><text x="48.0" y="96.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" text-anchor="start">HOS is experimental robotics software. Use it responsibly.</text><clipPath id="clsafety"><rect x="36" y="130" width="1128" height="434" rx="22"/></clipPath><g clip-path="url(#clsafety)"><rect x="36.0" y="130.0" width="1128.0" height="58.0" rx="0" fill="#22c55e" fill-opacity="1"/><text x="52.0" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">Do</text><text x="616.0" y="167.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0b1224" text-anchor="start">Do not</text><rect x="36.0" y="188.0" width="1128.0" height="78.0" rx="0" fill="#111b33" fill-opacity="1"/><text x="52.0" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22c55e" text-anchor="start">Keep a human operator present during any physical</text><text x="52.0" y="245.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22c55e" text-anchor="start">test</text><text x="616.0" y="219.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Run it unattended around people, animals, or fragile</text><text x="616.0" y="245.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">property</text><rect x="36.0" y="266.0" width="1128.0" height="78.0" rx="0" fill="#0d1630" fill-opacity="1"/><text x="52.0" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22c55e" text-anchor="start">Treat every plan as a proposal, not permission to</text><text x="52.0" y="323.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22c55e" text-anchor="start">move</text><text x="616.0" y="297.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Skip simulation before enabling USB output</text><rect x="36.0" y="344.0" width="1128.0" height="64.0" rx="0" fill="#111b33" fill-opacity="1"/><text x="52.0" y="375.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22c55e" text-anchor="start">Calibrate the workspace and camera first</text><text x="616.0" y="375.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Trust board coordinates before calibration</text><rect x="36.0" y="408.0" width="1128.0" height="78.0" rx="0" fill="#0d1630" fill-opacity="1"/><text x="52.0" y="439.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22c55e" text-anchor="start">Confirm the serial device and baud rate before arming</text><text x="616.0" y="439.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Use it near sharp tools, high heat, or hazardous</text><text x="616.0" y="465.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">materials without a validated safety system</text><rect x="36.0" y="486.0" width="1128.0" height="78.0" rx="0" fill="#111b33" fill-opacity="1"/><text x="52.0" y="517.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#22c55e" text-anchor="start">Keep clear zones and an easy emergency stop</text><text x="616.0" y="517.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">Ignore the safety rules of the connected robot,</text><text x="616.0" y="543.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" text-anchor="start">controller, and tools</text></g><rect x="36" y="130" width="1128" height="434" rx="22" fill="none" stroke="#24314f" stroke-width="2"/></svg>